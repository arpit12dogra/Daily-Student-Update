<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner border glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Graduation Cap (Mortarboard) -->
  <g filter="url(#shadow)">
    <!-- Cap Top Diamond -->
    <polygon points="256,140 430,220 256,300 82,220" fill="#ffffff"/>

    <!-- Cap Skull Base -->
    <path d="M142,250 L142,320 C142,370 370,370 370,320 L370,250 C336,275 296,288 256,288 C216,288 176,275 142,250 Z" fill="#e2e8f0"/>

    <!-- Golden Button on top -->
    <circle cx="256" cy="220" r="14" fill="url(#goldGrad)"/>

    <!-- Golden Tassel hanging down -->
    <path d="M256,224 C280,240 330,265 330,310 L320,360 L340,360 L330,310" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- Tassel fringed end -->
    <polygon points="320,356 340,356 345,390 315,390" fill="url(#goldGrad)"/>

    <!-- Small Sparkle / Alert star badge -->
    <path d="M400,140 Q400,165 425,165 Q400,165 400,190 Q400,165 375,165 Q400,165 400,140 Z" fill="#fef08a"/>
  </g>
</svg>

