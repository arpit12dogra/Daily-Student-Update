<nav class="navbar" [class.scrolled]="isScrolled()">
  <div class="container">
    <div class="navbar-content">
      <!-- Brand -->
      <a routerLink="/" class="navbar-brand">
        <mat-icon class="brand-icon">school</mat-icon>
        <div class="brand-text">
          <span class="brand-title">Daily Student</span>
          <span class="brand-subtitle">Updates</span>
        </div>
      </a>

      <!-- Desktop Nav -->
      <ul class="nav-links">
        @for (link of navLinks; track link.path) {
          <li>
            <a [routerLink]="link.path"
               class="nav-link"
               [class.active]="isActive(link.path)">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <!-- Actions -->
      <div class="navbar-actions">
        <a routerLink="/admin" mat-stroked-button color="primary" class="admin-btn">
          <mat-icon>admin_panel_settings</mat-icon>
          Admin
        </a>
        <!-- Mobile Menu Toggle -->
        <button mat-icon-button class="menu-toggle" (click)="toggleMobileMenu()">
          <mat-icon>{{ isMobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  @if (isMobileMenuOpen()) {
    <div class="mobile-menu">
      <ul>
        @for (link of navLinks; track link.path) {
          <li>
            <a [routerLink]="link.path"
               class="mobile-nav-link"
               [class.active]="isActive(link.path)">
              <mat-icon>{{ link.icon }}</mat-icon>
              {{ link.label }}
            </a>
          </li>
        }
        <li>
          <a routerLink="/admin" class="mobile-nav-link admin-link">
            <mat-icon>admin_panel_settings</mat-icon>
            Admin Panel
          </a>
        </li>
      </ul>
    </div>
  }
</nav>
